# Render Blueprint — deploys backend (web service) + frontend (static site)
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: document-portal-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false          # Set this manually in the Render dashboard
      - key: JWT_SECRET
        sync: false          # Set this manually in the Render dashboard
      - key: FRONTEND_URL
        fromService:
          name: document-portal-frontend
          type: web
          property: deployedURL

  # ── Frontend Static Site ──────────────────────────────────────────────────
  - type: web
    name: document-portal-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          name: document-portal-backend
          type: web
          property: deployedURL
          value: /api   # appended to the backend deployedURL
    routes:
      # SPA fallback — send all routes to index.html
      - type: rewrite
        source: /*
        destination: /index.html
